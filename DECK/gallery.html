<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DECK · Gallery</title>
  <link rel="stylesheet" href="./assets/css/site.css" />
  <script src="./assets/js/site.js"></script>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
</head>
<body>
<main class="shell">
  <div class="page-head">
    <div class="eyebrow">Gallery</div>
    <h1>All 136 <em>source objects.</em></h1>
    <p class="lede">Reconstructed programs are shown next to the OpenSCAD model they reproduce. Drag the 3D models to inspect them.</p>
  </div>

  <section class="block">
    <div class="grid-3" id="viewers"></div>
  </section>

  <section class="block">
    <div class="chips" id="cat"></div>
    <div class="gallery" id="grid" style="margin-top:16px"></div>
  </section>
</main>
<script>
const V = [['deck-fortress.glb', 'deck-fortress.png', 'Medieval fortress'], ['job_0001_flat-hinge.glb', null, 'Flat hinge'], ['job_0024_miniature-brick-lumber-house.glb', null, 'Brick and lumber house']];
document.getElementById('viewers').innerHTML = V.map(([g, p, n]) => `<div class="model-stage" style="height:300px"><model-viewer src="./assets/models/${g}" ${p ? `poster="./assets/posters/${p}"` : ''} camera-controls touch-action="pan-y" auto-rotate shadow-intensity="0.8" exposure="1.05" alt="${n}"></model-viewer><div class="stage-label">${n}</div></div>`).join('');
loadJSON('./assets/data/sources.json').then((src) => {
  const C = [['', 'All'], ['architecture', 'Architecture'], ['furniture', 'Furniture'], ['manufacture', 'Manufacturing'], ['3DCodeBench', '3DCodeBench']];
  const cat = document.getElementById('cat');
  cat.innerHTML = C.map(([k, n]) => `<button class="chip" data-k="${k}">${n} · ${k ? src.filter((s) => s.category === k).length : src.length}</button>`).join('');
  const draw = (k) => {
    cat.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c.dataset.k === k));
    document.getElementById('grid').innerHTML = src.filter((s) => !k || s.category === k).map((s) => `<div class="tile" ${s.scad_thumb ? 'style="grid-column:span 2"' : ''}>
      ${s.scad_thumb ? `<div class="pair"><img loading="lazy" src="${s.scad_thumb}" alt="OpenSCAD" title="OpenSCAD source"><img loading="lazy" src="${s.thumb}" alt="Blender" title="Blender program"></div>` : `<img loading="lazy" src="${s.thumb}" alt="">`}
      <div class="cap"><b>${esc(s.display_name)}</b><span>${s.scad_thumb ? 'OpenSCAD → Blender · ' : ''}${esc(s.category)} · ${s.loc} lines${s.iterations ? ` · ${s.iterations} iteration${s.iterations > 1 ? 's' : ''}` : ''}</span><br><span>${esc(s.description || '')}</span></div></div>`).join('');
  };
  cat.querySelectorAll('.chip').forEach((c) => (c.onclick = () => draw(c.dataset.k)));
  draw('');
});
</script>
</body>
</html>
